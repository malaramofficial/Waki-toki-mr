<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title></title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:#000;overflow:hidden}
#call{position:fixed;inset:0;background:#000}
#remote{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
#local{position:absolute;z-index:2;right:14px;top:calc(env(safe-area-inset-top) + 14px);width:clamp(100px,27vw,145px);height:clamp(140px,23vh,195px);object-fit:cover;background:#111;border-radius:12px;border:1px solid #ffffff66;transform:scaleX(-1)}
#local.rear{transform:none}
#controls{position:absolute;z-index:3;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:center;gap:clamp(18px,7vw,38px);padding:18px 18px calc(env(safe-area-inset-bottom) + 20px);background:linear-gradient(transparent,#0009)}
.control{width:62px;height:62px;border:0;border-radius:50%;display:grid;place-items:center;background:#292929;color:#fff}
.control.off{background:#e7e7e7;color:#111}
.control:disabled{opacity:.4}
.control svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(orientation:landscape){#local{width:clamp(100px,17vw,155px);height:clamp(125px,30vh,190px)}}
</style>
</head>
<body>
<main id="call">
<video id="remote" autoplay playsinline></video>
<video id="local" autoplay muted playsinline></video>
<nav id="controls" aria-label="कॉल कंट्रोल">
<button id="camera" class="control" aria-label="कैमरा बंद करें">
<svg viewBox="0 0 24 24"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/></svg>
</button>
<button id="mic" class="control" aria-label="माइक म्यूट करें">
<svg viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5m-4 0h8"/></svg>
</button>
<button id="switch" class="control" aria-label="कैमरा बदलें">
<svg viewBox="0 0 24 24"><path d="M20 7h-3l-2-3H9L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2Z"/><circle cx="12" cy="13" r="3"/></svg>
</button>
</nav>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,signInAnonymously} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getDatabase,ref,get,set,remove,onChildAdded,onChildRemoved,onDisconnect,runTransaction} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";
import Peer from "https://esm.sh/peerjs@1.5.4";
const firebaseConfig={
 apiKey:"AIzaSyB2u8HbafSnKfmiuVd4zU3BHQMnne_"+"AGSU",
 authDomain:"voter-slip-machine.firebaseapp.com",
 databaseURL:"https://voter-slip-machine-default-rtdb.firebaseio.com",
 projectId:"voter-slip-machine",
 storageBucket:"voter-slip-machine.firebasestorage.app",
 messagingSenderId:"60425502661",
 appId:"1:60425502661:web:6852d55e54f66cab14d5ac"
};
const $=id=>document.getElementById(id);
const state={db:null,peer:null,room:"",id:"",stream:null,call:null,remoteId:"",cameraOff:false,micOff:false,rear:false,unsubs:[]};
const roomRef=()=>ref(state.db,"wakiTokiRooms/"+state.room);
const peopleRef=()=>ref(state.db,"wakiTokiRooms/"+state.room+"/participants");
const personRef=id=>ref(state.db,"wakiTokiRooms/"+state.room+"/participants/"+id);
function showRemote(stream){$("remote").srcObject=stream;$("remote").play().catch(()=>{});}
function connectCall(call){
 if(state.call&&state.call!==call){call.close();return;}
 state.call=call;state.remoteId=call.peer;
 call.on("stream",showRemote);
 call.on("close",()=>{if(state.call===call){state.call=null;state.remoteId="";$("remote").srcObject=null;}});
 call.on("error",e=>console.error("call",e));
}
function dial(id){
 if(!state.peer||!state.stream||state.call||state.remoteId||id===state.id||state.id<id)return;
 state.remoteId=id;
 const c=state.peer.call(id,state.stream,{metadata:{room:state.room}});
 if(c)connectCall(c);else state.remoteId="";
}
async function start(){
 try{
  if(!isSecureContext||!navigator.mediaDevices?.getUserMedia)throw Error("HTTPS पर खोलें");
  const params=new URLSearchParams(location.search);
  state.room=(params.get("room")||("c"+crypto.randomUUID().replaceAll("-",""))).toLowerCase().replace(/[^a-z0-9_-]/g,"").slice(0,40);
  if(!params.get("room")){const u=new URL(location.href);u.searchParams.set("room",state.room);history.replaceState({call:true},"",u);}
  const app=initializeApp(firebaseConfig);const auth=getAuth(app);state.db=getDatabase(app);
  await signInAnonymously(auth);
  const audio={echoCancellation:true,noiseSuppression:true,autoGainControl:true};
  try{state.stream=await navigator.mediaDevices.getUserMedia({audio,video:{facingMode:{ideal:"user"},width:{ideal:720},height:{ideal:1280},aspectRatio:{ideal:9/16}}});}
  catch(e){state.stream=await navigator.mediaDevices.getUserMedia({audio,video:{facingMode:{ideal:"user"}}});}
  $("local").srcObject=state.stream;$("local").play().catch(()=>{});
  state.peer=new Peer(undefined,{debug:0});
  state.peer.on("open",async id=>{
   state.id=id;
   const transaction=await runTransaction(peopleRef(),people=>{
    people=people||{};
    if(Object.keys(people).length>=2&&!people[id])return;
    people[id]={id,joinedAt:Date.now()};
    return people;
   });
   if(!transaction.committed)throw Error("इस कॉल में पहले से दो लोग जुड़े हैं");
   await onDisconnect(personRef(id)).remove();
   const initial=transaction.snapshot.val()||{};
   Object.keys(initial).forEach(other=>dial(other));
   state.unsubs.push(onChildAdded(peopleRef(),s=>{if(s.key!==state.id)dial(s.key);}));
   state.unsubs.push(onChildRemoved(peopleRef(),s=>{
    if(s.key===state.remoteId){state.call?.close();state.call=null;state.remoteId="";$("remote").srcObject=null;}
   }));
  });
  state.peer.on("call",call=>{
   if(call.metadata?.room!==state.room||state.call){call.close();return;}
   call.answer(state.stream);connectCall(call);
  });
  state.peer.on("error",e=>console.error("peer",e));
  state.peer.on("disconnected",()=>{if(state.peer&&!state.peer.destroyed)state.peer.reconnect();});
 }catch(e){console.error(e);document.body.innerHTML="";alert("कॉल शुरू नहीं हो सकी। कैमरा/माइक की अनुमति दें और HTTPS लिंक खोलें।");}
}
$("camera").addEventListener("click",()=>{
 state.cameraOff=!state.cameraOff;
 state.stream?.getVideoTracks().forEach(t=>t.enabled=!state.cameraOff);
 $("camera").classList.toggle("off",state.cameraOff);
 $("camera").setAttribute("aria-label",state.cameraOff?"कैमरा चालू करें":"कैमरा बंद करें");
});
$("mic").addEventListener("click",()=>{
 state.micOff=!state.micOff;
 state.stream?.getAudioTracks().forEach(t=>t.enabled=!state.micOff);
 $("mic").classList.toggle("off",state.micOff);
 $("mic").setAttribute("aria-label",state.micOff?"माइक अनम्यूट करें":"माइक म्यूट करें");
});
$("switch").addEventListener("click",async()=>{
 if(!state.stream)return;
 $("switch").disabled=true;
 let replacement;
 try{
  replacement=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:state.rear?"user":"environment"}},audio:false});
  const track=replacement.getVideoTracks()[0];
  const sender=state.call?.peerConnection?.getSenders?.().find(s=>s.track?.kind==="video");
  if(sender)await sender.replaceTrack(track);
  const old=state.stream.getVideoTracks()[0];if(old){old.stop();state.stream.removeTrack(old);}
  state.stream.addTrack(track);track.enabled=!state.cameraOff;
  state.rear=!state.rear;$("local").classList.toggle("rear",state.rear);
  $("local").srcObject=state.stream;
 }catch(e){console.error("camera switch",e);}
 finally{$("switch").disabled=false;replacement?.getAudioTracks().forEach(t=>t.stop());}
});
async function cleanup(){
 state.unsubs.forEach(fn=>{try{fn();}catch{}});
 try{state.call?.close();}catch{}
 try{if(state.id&&state.db)await remove(personRef(state.id));}catch{}
 try{state.peer?.destroy();}catch{}
 state.stream?.getTracks().forEach(t=>t.stop());
}
window.addEventListener("pagehide",cleanup);
start();
</script>
</body>
</html>
