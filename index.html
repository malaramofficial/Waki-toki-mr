<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>स्मार्ट ग्रुप वीडियो & PTT ऐप</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0b0f19;
            color: #ffffff;
            text-align: center;
            padding: 10px;
            margin: 0;
            box-sizing: border-box;
        }
        .container {
            max-width: 900px;
            margin: auto;
            background: #111827;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.7);
        }
        
        /* मुख्य स्क्रीन जहाँ एक्टिव/बोलने वाले का बड़ा वीडियो दिखेगा */
        .active-speaker-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            min-height: 260px;
            margin-bottom: 15px;
            background: #1f2937;
            border-radius: 10px;
            padding: 10px;
            border: 2px dashed #374151;
            align-items: center;
        }
        
        .active-box {
            position: relative;
            width: 280px;
            height: 200px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid #22c55e; /* बोलने वाले पर हरा बॉर्डर (Focus) */
            box-shadow: 0 0 15px rgba(34,197,94,0.5);
            animation: popUp 0.3s ease-in-out;
        }

        @keyframes popUp {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* नीचे छोटे कॉर्नर वाले वीडियो (बाकी मेंबर्स) */
        .grid-title {
            text-align: left;
            font-size: 14px;
            color: #9ca3af;
            margin: 5px 0;
        }
        .video-grid {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 10px;
            min-height: 110px;
        }
        .video-box {
            position: relative;
            min-width: 130px;
            width: 130px;
            height: 95px;
            background: #000;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #374151;
            flex-shrink: 0;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .user-label {
            position: absolute;
            bottom: 3px;
            left: 3px;
            background: rgba(0, 0, 0, 0.7);
            padding: 1px 5px;
            font-size: 10px;
            border-radius: 3px;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            font-size: 16px;
            border-radius: 6px;
            border: none;
            box-sizing: border-box;
        }
        input {
            background: #374151;
            color: white;
            border: 1px solid #4b5563;
        }
        .btn-connect { background: #2563eb; color: white; cursor: pointer; font-weight: bold; }
        
        /* पुश टू टॉक बटन */
        .btn-ptt {
            background: #dc2626;
            color: white;
            font-size: 18px;
            height: 65px;
            border-radius: 32px;
            margin-top: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(220,38,38,0.4);
            transition: 0.2s;
        }
        .btn-ptt.active { background: #16a34a; box-shadow: 0 4px 10px rgba(22,163,74,0.4); }
        #status {
            margin: 10px 0;
            font-weight: bold;
            color: #f59e0b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎥 स्मार्ट ग्रुप वीडियो & वॉकी-टॉकी</h2>
    <div id="status">स्थिति: डिस्कनेक्टेड</div>

    <div id="setup-box">
        <input type="text" id="roomId" placeholder="रूम का नाम दर्ज करें (जैसे: my-room-99)">
        <button class="btn-connect" onclick="joinRoom()">रूम से जुड़ें</button>
    </div>

    <!-- 1. मुख्य स्क्रीन: जो बोल रहा है (बटन दबाए है) उसका वीडियो बड़ा होकर यहाँ पॉप-अप होगा -->
    <div class="grid-title">🎙️ मुख्य वक्ता (Active Speakers):</div>
    <div class="active-speaker-container" id="activeSpeakerContainer">
        <!-- शुरुआत में लोकल यूजर खुद यहाँ दिखेगा जब वो बोलेगा -->
        <div class="active-box" id="active-local" style="display:none;">
            <video id="activeLocalVideo" autoplay playsinline muted></video>
            <div class="user-label">आप (Me - Speaking)</div>
        </div>
    </div>

    <!-- 2. नीचे की तरफ बाकी सभी सदस्यों के छोटे कॉर्नर वीडियो -->
    <div class="grid-title">👥 अन्य सदस्य (All Participants):</div>
    <div class="video-grid" id="videoGrid">
        <div class="video-box" id="grid-local">
            <video id="localVideo" autoplay playsinline muted></video>
            <div class="user-label">आप (Me)</div>
        </div>
    </div>

    <!-- पुश टू टॉक (PTT) कंट्रोल बटन -->
    <button id="pttBtn" class="btn-ptt" disabled 
        onmousedown="startTalk()" onmouseup="stopTalk()" 
        ontouchstart="startTalk()" ontouchend="stopTalk()">
        बोलने के लिए दबाएं रखें<br><small>(Hold to Talk - Pop Up Video)</small>
    </button>
</div>

<!-- PeerJS CDN -->
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<script>
    let peer;
    let localStream;
    let connectedPeers = {};
    const statusDiv = document.getElementById('status');
    const videoGrid = document.getElementById('videoGrid');
    const activeSpeakerContainer = document.getElementById('activeSpeakerContainer');
    const localVideo = document.getElementById('localVideo');
    const activeLocalVideo = document.getElementById('activeLocalVideo');
    const activeLocalBox = document.getElementById('active-local');
    const pttBtn = document.getElementById('pttBtn');
    let isConnected = false;

    async function joinRoom() {
        const roomId = document.getElementById('roomId').value.trim();
        if (!roomId) {
            alert('कृपया रूम का नाम दर्ज करें!');
            return;
        }

        statusDiv.innerText = "कैमरा और माइक की अनुमति ली जा रही है...";
        try {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            localStream.getAudioTracks()[0].enabled = false; // शुरू में माइक म्यूट
            localVideo.srcObject = localStream;
            activeLocalVideo.srcObject = localStream;
        } catch (err) {
            alert("कैमरा/माइक की परमिशन नहीं मिली: " + err);
            return;
        }

        statusDiv.innerText = "कनेक्ट हो रहा है...";
        peer = new Peer();

        peer.on('open', (id) => {
            statusDiv.innerText = "🟢 कनेक्टेड! बातचीत के लिए तैयार।";
            statusDiv.style.color = "#22c55e";
            document.getElementById('setup-box').style.display = "none";
            pttBtn.disabled = false;
            isConnected = true;
        });

        peer.on('call', (call) => {
            call.answer(localStream);
            call.on('stream', (remoteStream) => {
                addParticipant(call.peer, remoteStream);
            });
            connectedPeers[call.peer] = { call: call, stream: remoteStream, speaking: false };
        });

        peer.on('error', (err) => {
            console.error(err);
        });
    }

    // नया यूजर जोड़ने का फंक्शन
    function addParticipant(peerId, stream) {
        if (document.getElementById(`grid-${peerId}`)) return;

        // नीचे छोटे ग्रिड में बॉक्स जोड़ें
        const box = document.createElement('div');
        box.className = 'video-box';
        box.id = `grid-${peerId}`;

        const video = document.createElement('video');
        video.srcObject = stream;
        video.autoplay = true;
        video.playsInline = true;

        const label = document.createElement('div');
        label.className = 'user-label';
        label.innerText = `यूजर: ${peerId.substring(0, 4)}`;

        box.appendChild(video);
        box.appendChild(label);
        videoGrid.appendChild(box);

        connectedPeers[peerId] = { stream: stream, peerId: peerId };
    }

    // Push To Talk: बटन दबाने पर माइक ऑन और वीडियो पॉप-अप होकर ऊपर (Active Speaker) आ जाएगा
    function startTalk() {
        if (!isConnected || !localStream) return;
        
        // 1. माइक ऑन करें
        localStream.getAudioTracks()[0].enabled = true;
        
        // 2. अपना वीडियो बड़ा करके ऊपर एक्टिव स्पीकर बॉक्स में दिखाएं
        activeLocalBox.style.display = "block";

        pttBtn.classList.add('active');
        pttBtn.innerText = "बोल रहे हैं (माइक्रोफ़ोन ऑन) 🎙️";
    }

    // बटन छोड़ने पर माइक बंद और वीडियो वापस नीचे छोटे ग्रिड में चला जाएगा
    function stopTalk() {
        if (!isConnected || !localStream) return;
        
        // 1. माइक म्यूट करें
        localStream.getAudioTracks()[0].enabled = false;
        
        // 2. अपना बड़ा वीडियो छुपाएं
        activeLocalBox.style.display = "none";

        pttBtn.classList.remove('active');
        pttBtn.innerText = "बोलने के लिए दबाएं रखें\n(Hold to Talk - Pop Up Video)";
    }
</script>

</body>
</html>
